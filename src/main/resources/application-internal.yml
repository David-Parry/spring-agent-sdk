# Qodo Core Configuration
qodo:
  baseUrl: ${COMMAND_BASE_URL:https://api.ng.command.qodo.ai}
  blockedTools: ${QODO_BLOCKED_TOOLS:}
  metrics:
    cache:
      max-size: ${QODO_METRICS_CACHE_MAX_SIZE:1000}
      expire-after-access-minutes: ${QODO_METRICS_CACHE_EXPIRE_MINUTES:60}
      record-stats: ${QODO_METRICS_CACHE_RECORD_STATS:true}
  agent:
    configFile: ${QODO_AGENT_CONFIG_FILE:classpath:agent.yml}
  mcp:
    request-timeout-seconds: ${QODO_MCP_REQUEST_TIMEOUT_SECONDS:900}
  websocket:
    token: ${WEBSOCKET_TOKEN}
    # Health check configuration
    # How often to send ping messages to verify connection health
    # Reduced from 30s to 15s for faster connection issue detection
    ping-interval-seconds: ${QODO_WS_PING_INTERVAL_SECONDS:35}
    # Maximum time to wait for pong response before considering connection dead
    # Reduced from 10s to 5s for faster failure detection
    pong-timeout-seconds: ${QODO_WS_PONG_TIMEOUT_SECONDS:18}

    # Connection timeout configuration
    # Maximum time to establish initial WebSocket connection
    connection-timeout-seconds: ${QODO_WS_CONNECTION_TIMEOUT_SECONDS:60}
    # Maximum time to wait for server READY signal after connection
    # Increase if experiencing timeout errors on slow networks
    ready-signal-timeout-seconds: ${QODO_WS_READY_SIGNAL_TIMEOUT_SECONDS:60}

    # Reconnection behavior
    # Maximum number of reconnection attempts before giving up
    max-reconnect-attempts: ${QODO_WS_MAX_RECONNECT_ATTEMPTS:3}
    # Initial delay before first reconnection attempt
    initial-reconnect-delay: ${QODO_WS_INITIAL_RECONNECT_DELAY:1s}
    # Maximum delay between reconnection attempts (with exponential backoff)
    max-reconnect-delay: ${QODO_WS_MAX_RECONNECT_DELAY:30s}

    # Session timeout configuration
    # Maximum total duration for a WebSocket session (prevents runaway sessions)
    # Default: 1800 seconds (30 minutes)
    total-session-timeout-seconds: ${QODO_WS_TOTAL_SESSION_TIMEOUT_SECONDS:1800}

# Messaging configuration
messaging:
  provider: ${MESSAGING_PROVIDER:activemq}
  queue:
    audit: ${MESSAGING_DEFAULT_TOPIC:audit}
    event: ${MESSAGING_EVENT_TOPIC:event}
    response: ${MESSAGING_RESPONSE_TOPIC:response}
  activemq:
    broker-url: ${MESSAGING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    username: ${MESSAGING_ACTIVEMQ_USERNAME:qodo}
    password: ${MESSAGING_ACTIVEMQ_PASSWORD:qodo}
  local:
    # Maximum capacity for each queue (number of messages)
    queue-capacity: ${LOCAL_QUEUE_CAPACITY:1000}
    # Number of consumer threads per queue (1 ensures message ordering)
    consumer-threads: ${LOCAL_CONSUMER_THREADS:1}
    # Maximum number of retry attempts for failed messages
    retry-attempts: ${LOCAL_RETRY_ATTEMPTS:3}
    # Initial delay in milliseconds before first retry
    retry-delay-ms: ${LOCAL_RETRY_DELAY_MS:1000}
    # Maximum delay in milliseconds between retries (with exponential backoff)
    max-retry-delay-ms: ${LOCAL_MAX_RETRY_DELAY_MS:30000}
    # Timeout in seconds for polling messages from the queue
    poll-timeout-seconds: ${LOCAL_POLL_TIMEOUT_SECONDS:5}
    # Whether to use exponential backoff for retries
    exponential-backoff: ${LOCAL_EXPONENTIAL_BACKOFF:true}
  kafka:
    # Connection settings
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    group-id: ${KAFKA_GROUP_ID:qodo-agent-group}
    # Consumer settings
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    enable-auto-commit: ${KAFKA_ENABLE_AUTO_COMMIT:false}
    max-poll-records: ${KAFKA_MAX_POLL_RECORDS:500}
    session-timeout-ms: ${KAFKA_SESSION_TIMEOUT_MS:30000}
    heartbeat-interval-ms: ${KAFKA_HEARTBEAT_INTERVAL_MS:10000}
    request-timeout-ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
    # Producer settings
    retries: ${KAFKA_RETRIES:3}
    acks: ${KAFKA_ACKS:all}
    linger-ms: ${KAFKA_LINGER_MS:1}
    batch-size: ${KAFKA_BATCH_SIZE:16384}
    buffer-memory: ${KAFKA_BUFFER_MEMORY:33554432}
    # Security settings (SSL/SASL) - disabled by default
    security:
      enabled: ${KAFKA_SECURITY_ENABLED:false}
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      # SSL settings
      truststore-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      truststore-password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      keystore-location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      keystore-password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      key-password: ${KAFKA_SSL_KEY_PASSWORD:}
      # SASL settings
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Spring configuration
spring:
  threads:
    virtual:
      enabled: true

# Actuator configuration
management:
  server:
    port: ${SERVER_PORT:8080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
    access:
      default: read_only
  endpoint:
    health:
      show-details: always
      access: read_only
    info:
      access: read_only
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    jms:
      enabled: ${JMS_HEALTH_ENABLED:true}
  metrics:
    tags:
      application: command-sdk
  prometheus:
    metrics:
      export:
        enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    io:
      modelcontextprotocol:
        client:
          transport:
            StdioClientTransport: ERROR
    com.davidparry.agent: INFO
    com.davidparry.agent.core: ${LOGGING_LEVEL_AI_QODO_COMMAND_INTERNAL:INFO}
    com.davidparry.agent.core.service.WebSocketService: DEBUG
    com.davidparry.agent.core.service.BaseHandler: TRACE
    com.davidparry.agent.core.transformer.TemplateProcessor: TRACE

  pattern:
    console: "%d{yy-MM-dd HH:mm:ss} - [%logger{36}] - %msg%n"
